name: INU TV server scan
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inu-tv-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Scan 200 URLs (4 workers)
        run: python3 scripts/scan.py --batch 200 --workers 4 --timeout 12
      - name: Commit JSON state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json data/scan-results.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update INU TV scan data"
            git push
          fi
