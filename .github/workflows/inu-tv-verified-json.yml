name: INU TV - Update Verified JSON
on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'CSV filename already uploaded into data/verification-uploads/ (e.g. batch-002.csv)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: inu-tv-verified-json-writer
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Merge and push with retry against latest branch
        env:
          CSV_FILE: ${{ inputs.csv_file }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            python3 scripts/merge_verifications.py
            if git diff --quiet -- data/verified-channels.json; then
              echo 'No changes to publish.'
              exit 0
            fi
            git add data/verified-channels.json
            git commit -m 'Update shared channel verification JSON'
            if git push origin "HEAD:$BRANCH"; then
              echo 'Shared JSON published.'
              exit 0
            fi
            echo "Push conflict; retry $attempt/5"
            sleep $((attempt * 3))
          done
          echo 'Could not publish after 5 retries' >&2
          exit 1
